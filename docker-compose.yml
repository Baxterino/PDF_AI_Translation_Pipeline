services:
  pdf-translator:
    build: .
    container_name: pdf-translator
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GITHUB_REPO=Baxterino/PDF_AI_Translation_Pipeline
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app_host_mount
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - shared_fonts:/usr/share/fonts
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    ports:
      - "8080:8080"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - SYSTEM_DEFAULTLOCALE=en-GB
    volumes:
      - stirling_training:/usr/share/tessdata
      - stirling_config:/configs
      - stirling_logs:/logs
      - shared_fonts:/usr/share/fonts:ro
    restart: unless-stopped

volumes:
  stirling_training:
  stirling_config:
  stirling_logs:
  shared_fonts:
